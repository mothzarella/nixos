name: check

on:
  workflow_dispatch:
  push:
    paths: ["**.nix", "flake.lock", ".github/**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/nix
      - run: nix flake check --no-build
