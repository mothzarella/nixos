name: check

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths: ["**.nix", "flake.lock", ".github/**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/nix
      - run: |
          nix eval .#checks.x86_64-linux --apply 'builtins.mapAttrs (_: d: d.drvPath)'
